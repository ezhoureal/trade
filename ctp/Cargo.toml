[package]
name = "ctp"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.0", features = ["derive", "env"] }
ctp2rs = { version = "0.1.7", features = ["openctp"] }
backtest = { path = "../backtest", features = ["live"] }
once_cell = "1.19"
polars = { version = "0.49.0", features = ["lazy", "parquet", "strings"] }
log = "0.4.22"
dotenv = "0.15.0"
env_logger = "0.11.5"


rand = "0.8.5"
chrono = "0.4"
futures = "0.3.31"


tokio = { version = "1.43.1", features = ["full"] }

[features]
# Provide empty feature to silence cfg checks used in code.
ctp_v6_7_11 = []
history_seed = []
