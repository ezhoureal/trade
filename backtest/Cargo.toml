[package]
name = "backtest"
version = "0.1.0"
edition = "2021"
authors = ["Tianer Zhou <ezhoureal@gmail.com>"]
license = "MIT"

[dependencies]
chrono = { version = "0.4", features=["serde"] }
clap = { version = "4.5", features=["derive"] }
serde = { version = "1", features=["derive"] }
serde_json = "1"
anyhow = "1"
ahash = "0.8"
rayon = "1.10"
polars = { version = "0.49.0", features = ["lazy", "parquet", "strings"] }
futures = "0.3.31"
async-trait = "0.1.89"
tokio = "1.47.1"

[features]
live = []
