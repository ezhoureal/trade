[workspace]
members = [
    "backtest",
    "ctp",
]
resolver = "3"

[workspace.package]
edition = "2021"

[workspace.dependencies]
ctp2rs = { version = "0.1.7", features = ["openctp"] }
polars = { version = "0.49.1", features = ["lazy", "parquet", "strings"] }
log = "0.4.22"
dotenv = "0.15.0"
env_logger = "0.11.5"
rand = "0.8.5"
futures = "0.3.31"
tokio = { version = "1.43.1", features = ["full"] }
anyhow = "1.0.99"
async-trait = "0.1.89"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ahash = "0.8"
rayon = "1.10"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
strip = true

[profile.dev]
incremental = true